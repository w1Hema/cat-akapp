workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build (Free Sideloadly)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: 3.19.6
      xcode: latest
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter pub get
      - name: Bypass Xcode Code Signing
        script: |
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/CODE_SIGN_IDENTITY = "";\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
      - name: Generate iOS Config
        script: |
          flutter build ios --config-only --no-codesign || true
      - name: Build Unsigned iOS App via xcodebuild
        script: |
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
      - name: Create Unsigned IPA for Sideloading
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r ios/build/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr cyber_cv_unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/cyber_cv_unsigned.ipa
