workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build (Free Sideloadly)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter Packages
        script: |
          flutter pub get
      - name: Build Unsigned iOS App
        script: |
          flutter build ios --release --no-codesign
      - name: Create Unsigned IPA for Sideloading
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r cyber_cv_unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/cyber_cv_unsigned.ipa
