name: cyber_cv_app
description: "ENG/IBRAHIM FATHY - Cyber CV Portfolio App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.8.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  animated_text_kit: ^4.2.2
  local_auth: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_perfect.png"
  adaptive_icon_background: "#0F111A"
  adaptive_icon_foreground: "assets/images/app_icon_perfect.png"
  remove_alpha_ios: true
  min_sdk_android: 21
