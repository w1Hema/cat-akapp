name: cyber_cv_app
description: "ENG/IBRAHIM FATHY - Cyber CV Portfolio App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  flutter_animate: any
  font_awesome_flutter: 10.7.0
  google_fonts: any
  url_launcher: any
  shared_preferences: any
  animated_text_kit: any
  local_auth: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_perfect.png"
  adaptive_icon_background: "#0F111A"
  adaptive_icon_foreground: "assets/images/app_icon_perfect.png"
  remove_alpha_ios: true
  min_sdk_android: 21
